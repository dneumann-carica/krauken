# Creates /run/krauken (Unix sockets) and /var/lib/krauken (SQLite DB, and
# later the supervisor's persisted protection state) on every boot, since
# /run is tmpfs and doesn't survive a reboot. Install as
# /etc/tmpfiles.d/krauken.conf and run `systemd-tmpfiles --create krauken.conf`
# once, or just reboot -- systemd applies tmpfiles.d rules at boot automatically.
#
# Type Path                Mode User    Group   Age Argument
d      /run/krauken         0750 krauken krauken -
d      /var/lib/krauken     0750 krauken krauken -
