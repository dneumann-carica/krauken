[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "krauken"
version = "0.1.0"
description = "Fermentation chamber controller: control daemon, hardware supervisor, web API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
]

[project.optional-dependencies]
# Pi-only hardware deps. Kept optional so the package imports and runs on any
# dev machine with only the Manual/Simulator platforms live -- see
# platforms/base.py's @requires_optional decorator.
pi = [
    "lgpio>=0.2",
    # NOT bleak -- verified 2026-08-11 against real hardware that bleak's
    # BlueZ D-Bus Discovery backend doesn't reliably surface Tilt's
    # iBeacon advertisement on Raspberry Pi (two independent scan
    # attempts, zero Tilt-shaped packets, despite the Tilt broadcasting
    # and being read successfully at the same time by both the phone
    # app and BrewPi Remix's own Tilt manager). aioblescan's raw HCI
    # socket scanning -- what BrewPi Remix itself uses -- caught the
    # same advertisement instantly and repeatedly. Needs CAP_NET_RAW on
    # the daemon process (see deploy/krauken-daemon.service), not full
    # root.
    "aioblescan>=0.2.14",
    "pyserial>=3.5",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "httpx>=0.27",
]

[project.scripts]
krauken-daemon = "krauken.daemon.__main__:main"
krauken-api = "krauken.api.__main__:main"
krauken-simulator = "krauken.platforms.simulator.__main__:main"
krauken-manual = "krauken.platforms.manual.__main__:main"
krauken-ipc = "krauken.ipc.cli:main"
krauken-db = "krauken.db.migrate:main"
krauken-hwid = "krauken.cli.hwid:main"
krauken-doctor = "krauken.cli.doctor:main"

[tool.hatch.build.targets.wheel]
packages = ["krauken"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
